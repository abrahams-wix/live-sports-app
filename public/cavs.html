<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cavaliers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/boxscore.css">
    <link rel="stylesheet" href="../styles/carousel.css">
</head>

<body class="team-cavs">
    <header>
        <nav id="logo-container">

            <div id="home-nav">
                <a href="./home.html"><img id="home-logo" src="../images/cleveland.png" width="100" height="100" alt="Cleveland sports home"></a>
            </div>

            <div id="page-nav">

                <ul>
                    <li><a href="./guards.html"><img class="logo" src="../images/guardians.png" width="60" height="60" alt="Guardians"></a></li>
                    <li><a href="./browns.html"><img class="logo" src="../images/browns.png" width="60" height="60" alt="Browns"></a></li>
                    <li><a href="./cavs.html"><img class="logo" src="../images/color-logos/cavs.png" width="60" height="60" alt="Cavaliers"></a></li>
                </ul>

            </div>



        </nav>




    </header>

    <main>
        <div class="page-loader" id="page-loader" aria-live="polite">
            <div class="loader-spinner"></div>
            <span class="loader-label">Loading schedule…</span>
        </div>
        <!-- Game Carousel -->
        <section class="carousel-section" role="region" aria-label="Upcoming schedule carousel">
            <h2 class="carousel-title" id="carousel-title">Upcoming Schedule</h2>
            <p class="carousel-status-msg" id="carousel-status-msg" aria-live="polite" hidden></p>
            <p class="carousel-live-region visually-hidden" id="carousel-live-region" aria-live="polite" aria-atomic="true"></p>
            <div class="carousel-container">
                <button class="carousel-btn prev" aria-label="Previous game"></button>
                <div class="carousel-track">
                    <!-- Slides generated by JavaScript -->
                </div>
                <button class="carousel-btn next" aria-label="Next game"></button>
            </div>
        </section>

        <!-- Boxscore (syncs with selected game above) -->
        <section class="boxscore-section" aria-label="Boxscore">
            <h2 class="boxscore-title" id="boxscore-title">Boxscore</h2>
            <div id="boxscore-container">
                <div class="boxscore-loader" id="boxscore-loader" aria-hidden="true" aria-live="polite">
                    <div class="loader-spinner"></div>
                </div>
                <p id="boxscore-error" class="boxscore-error-msg" aria-live="polite" hidden>Couldn't load boxscore.</p>
                <table class="play-bold" id="boxscore"></table>
            </div>
        </section>
    </main>

    <footer>
        <p>Designed and maintained by <a href="https://github.com/abrahams-wix">abrahams-wix</a></p>
    </footer>

    <script src="../scripts/boxscore.js"></script>
    <script src="../scripts/schedule-data.js"></script>
    <script src="../scripts/cavs-data.js"></script>
    <script src="../scripts/carousel.js"></script>
    <script>
        window.TEAM_PAGE_CONFIG = { sport: "basketball", loadSchedule: loadCavsSchedule };
    </script>
    <script src="../scripts/team-page-init.js"></script>
</body>

</html>
